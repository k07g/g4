name: 機能要望
description: 新機能や改善の提案
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景・課題
      description: 何が困っているか、なぜこの提案が必要かを説明してください
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: どのような機能・変更を想定しているか記載してください
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 補足情報
      description: 関連するIssueやリンクなどがあれば記載してください
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueに同じ内容が無いか検索しました
          required: true
