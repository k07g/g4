name: Terraform Dev Apply

# main にマージされ、dev環境のTerraformコード(またはそれが参照する
# モジュール)が変更された場合に、dev環境のCognitoリソースを自動で
# terraform apply する。
on:
  push:
    branches: [main]
    paths:
      - terraform/environments/dev/**
      - terraform/modules/**
      - .github/workflows/terraform-dev-apply.yml
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# 同時実行によるstate競合を防ぐ
concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # リポジトリの Settings > Environments > dev で必須レビュアーを設定
    # すれば、apply前に手動承認を挟むことも可能(既定では承認不要)。
    environment: dev
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=g4/dev/cognito.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'ap-northeast-1' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
